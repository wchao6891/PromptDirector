<!doctype html>
<html lang="zh-CN" data-i18n-title="精选案例">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>精选案例</title>
    <script src="theme-bootstrap.js"></script>
    <link rel="stylesheet" href="ui-foundation.css" />
    <link rel="stylesheet" href="curated.css" />
  </head>
  <body>
    <header class="curated-header">
      <h1 data-i18n="精选案例">精选案例</h1>
      <button id="return-library" class="button-secondary page-back-action" type="button"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/ui-icons.svg#icon-arrow-left"></use></svg><span id="return-label">返回我的案例库</span></button>
    </header>
    <main>
      <div class="curated-status-row">
        <p id="curated-status" class="curated-status" role="status" aria-live="polite"></p>
        <button id="retry-catalog" class="button-secondary" type="button" hidden data-i18n="重试">重试</button>
      </div>

      <section id="themes-view" class="themes-view">
        <header class="themes-heading">
          <h2 data-i18n="按期浏览">按期浏览</h2>
          <p data-i18n="选择一期主题，再浏览或保存其中的案例。">选择一期主题，再浏览或保存其中的案例。</p>
        </header>
        <section id="theme-grid" class="theme-grid" aria-live="polite"></section>
      </section>

      <section id="cases-view" class="cases-view" hidden>
        <header class="theme-toolbar">
          <div class="theme-toolbar-copy">
            <h2 id="active-theme-title"></h2>
            <p id="active-theme-summary"></p>
          </div>
          <div class="theme-save-actions">
            <span class="theme-save-summary"><strong id="active-theme-count"></strong><small id="theme-save-status"></small></span>
            <button id="save-theme" type="button" data-i18n="全部保存">全部保存</button>
          </div>
        </header>
        <section id="curated-grid" class="curated-grid" aria-live="polite"></section>
        <div id="load-sentinel" class="load-sentinel" aria-hidden="true"></div>
        <button id="load-more" class="button-secondary load-more" type="button" hidden data-i18n="继续加载">继续加载</button>
        <section id="curated-empty" class="curated-empty" hidden>
          <strong data-i18n="还没有可显示的精选案例">还没有可显示的精选案例</strong>
          <p data-i18n="联网检查目录，或稍后再试。已缓存的目录在离线时仍可查看。">联网检查目录，或稍后再试。已缓存的目录在离线时仍可查看。</p>
        </section>
      </section>

      <section id="curated-loading" class="curated-loading" aria-label="正在加载精选案例" data-i18n-aria-label="正在加载精选案例" hidden>
        <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
      </section>
    </main>
    <div id="detail-backdrop" class="detail-backdrop" hidden></div>
    <aside id="detail-drawer" class="detail-drawer" role="dialog" aria-modal="true" aria-label="精选案例详情" data-i18n-aria-label="精选案例详情" aria-hidden="true">
      <div class="detail-toolbar">
        <div>
          <button id="detail-prev" class="icon-button" type="button" aria-label="上一个案例" title="上一个案例"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/ui-icons.svg#icon-chevron-left"></use></svg></button>
          <button id="detail-next" class="icon-button" type="button" aria-label="下一个案例" title="下一个案例"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/ui-icons.svg#icon-chevron-right"></use></svg></button>
        </div>
        <button id="detail-close" class="icon-button" type="button" aria-label="关闭详情" title="关闭详情"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/ui-icons.svg#icon-x"></use></svg></button>
      </div>
      <div id="detail-content" class="detail-content"></div>
    </aside>
    <script type="module" src="curated-page.js"></script>
  </body>
</html>
