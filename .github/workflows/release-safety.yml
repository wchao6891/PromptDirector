name: Release safety

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-safety-${{ github.ref }}
  cancel-in-progress: true

# Four independent runners divide the existing suite without sharing profiles,
# ports or media memory. This is processing concurrency, not a product quota.
env:
  CI_BROWSER_SHARDS: 4
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan checks from the actual change
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      tier: ${{ steps.plan.outputs.tier }}
      matrix: ${{ steps.plan.outputs.matrix }}
      package: ${{ steps.plan.outputs.package }}
      browser: ${{ steps.plan.outputs.browser }}
      upgrade: ${{ steps.plan.outputs.upgrade }}
      connector: ${{ steps.plan.outputs.connector }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 tools/ci-release.py plan --full --shards "$CI_BROWSER_SHARDS"
          else
            python3 tools/ci-release.py plan --base "$CI_BASE" --shards "$CI_BROWSER_SHARDS"
          fi

  source-contracts:
    name: Source and compatibility contracts
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: python3 -m unittest discover -s test -p 'ci_release_test.py'
      - if: needs.plan.outputs.tier == 'light'
        run: node tools/validate-public-source.mjs
      - if: needs.plan.outputs.tier != 'light'
        run: npm ci
      - if: needs.plan.outputs.tier != 'light'
        run: npm ci --prefix connector --ignore-scripts
      - if: needs.plan.outputs.tier != 'light'
        run: npm run verify:source

  package:
    name: Build one package bundle
    needs: [plan, source-contracts]
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run package:release
      - run: node tools/prepare-public-release.mjs
      - run: npm run package:connector
      - run: python3 tools/ci-release.py seal
      - uses: actions/upload-artifact@v7
        with:
          name: promptdirector-packages-${{ github.sha }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14

  browser-shards:
    name: Packaged Chromium shard ${{ matrix.shard }}
    needs: [plan, package]
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-browser
      - uses: actions/download-artifact@v8
        with:
          name: promptdirector-packages-${{ github.sha }}
          path: dist
      - run: python3 tools/ci-release.py browser --shard "${{ matrix.shard }}" --evidence "dist/ci-browser/${{ matrix.shard }}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promptdirector-browser-evidence-${{ github.sha }}-${{ matrix.shard }}
          path: dist/ci-browser/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  linux-upgrade:
    name: Linux packaged upgrade
    needs: [plan, package]
    if: needs.plan.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-browser
      - uses: actions/download-artifact@v8
        with:
          name: promptdirector-packages-${{ github.sha }}
          path: dist
      - run: python3 tools/ci-release.py verify
      - run: npm run test:upgrade
      - run: python3 tools/ci-release.py verify

  windows-portability:
    name: Windows packaged data and project interactions
    needs: [plan, package]
    if: needs.plan.outputs.upgrade == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-browser
      - uses: actions/download-artifact@v8
        with:
          name: promptdirector-packages-${{ github.sha }}
          path: dist
      - run: python tools/ci-release.py verify
      - name: Guard import deduplication growth and replacement semantics
        run: node --test test/library-import-dedup.test.js
      - name: Check the same installation package on Windows
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, subprocess, sys, zipfile
          version = json.loads(pathlib.Path('extension/manifest.json').read_text())['version']
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'PromptDirector'
          with zipfile.ZipFile(f'dist/PromptDirector-{version}.zip') as archive:
              archive.extractall(destination)
          env = {**os.environ, 'PROMPTDIRECTOR_E2E_EXTENSION_DIR': str(destination), 'PROMPTDIRECTOR_E2E_BLOCK_EXTERNAL_NETWORK': '1'}
          for script in ['project_tree_e2e.py', 'library_import_resources_e2e.py', 'library_import_ui_e2e.py', 'library_import_preview_e2e.py', 'library_import_interruption_e2e.py', 'image_generation_info_e2e.py', 'skill_cover_e2e.py']:
              subprocess.run([sys.executable, f'test/{script}'], env=env, check=True)
          PYTHON
      - run: npm run test:upgrade
      - run: python tools/ci-release.py verify

  connector-platforms:
    name: Native connector (${{ matrix.os }})
    needs: [plan, source-contracts]
    if: needs.plan.outputs.connector == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - run: npm ci --prefix connector --ignore-scripts
      - run: node --test connector/test/*.test.mjs

  browser-package:
    # Keep the existing required check; an always-run gate rejects failures,
    # cancellations, missing shards and packages with a different source/digest.
    name: Chromium journeys and packaged upgrade
    needs: [plan, source-contracts, package, browser-shards, linux-upgrade, windows-portability, connector-platforms]
    if: always()
    runs-on: ubuntu-latest
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v6
      - if: needs.package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: promptdirector-packages-${{ github.sha }}
          path: dist
      - if: needs.browser-shards.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: promptdirector-browser-evidence-${{ github.sha }}-*
          path: dist/ci-browser
      - run: python3 tools/ci-release.py gate
      - if: needs.plan.outputs.tier == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: promptdirector-tested-packages-${{ github.sha }}
          path: |
            dist/PromptDirector-*.zip
            dist/store/*.zip
            dist/github/**
            dist/ci-package.json
            dist/ci-validation.json
          if-no-files-found: error
          retention-days: 14
