name: Release safety

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source and compatibility contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix connector --ignore-scripts
      - run: npm run verify:source

  browser-package:
    name: Chromium journeys and packaged upgrade
    needs: source-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install the pinned Chromium test runtime
        run: |
          python -m pip install playwright==1.58.0
          # Playwright supplies Chromium; the runner's unrelated Chrome APT mirror
          # can publish inconsistent indexes and is not needed for OS dependencies.
          sudo python - <<'PYTHON'
          from pathlib import Path
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix in ('.list', '.sources') and 'dl.google.com/linux/chrome' in source.read_text():
                  source.rename(source.with_suffix(source.suffix + '.disabled'))
          PYTHON
          python -m playwright install --with-deps chromium
      - run: npm run test:local-extension
      - run: npm run package:release
      - run: node tools/prepare-public-release.mjs
      - run: npm run package:connector
      - run: npm run test:upgrade
      - name: Verify extension and connector archives
        run: |
          PROMPTDIRECTOR_PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          unzip -t "dist/PromptDirector-${PROMPTDIRECTOR_PACKAGE_VERSION}.zip"
          unzip -t "dist/store/PromptDirector-${PROMPTDIRECTOR_PACKAGE_VERSION}-Chrome-Web-Store.zip"
          unzip -t "dist/PromptDirector-${PROMPTDIRECTOR_PACKAGE_VERSION}-Agent-Connector.zip"
      - name: Preserve the exact tested packages
        uses: actions/upload-artifact@v7
        with:
          name: promptdirector-tested-packages-${{ github.sha }}
          path: |
            dist/PromptDirector-*.zip
            dist/store/*.zip
            dist/github/**
          if-no-files-found: error
          retention-days: 14

  windows-portability:
    name: Windows packaged data and project interactions
    needs: source-contracts
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install chromium
      - run: npm run package
      - name: Check the Windows installation package
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys, zipfile
          version = json.loads(pathlib.Path('extension/manifest.json').read_text())['version']
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'PromptDirector'
          with zipfile.ZipFile(f'dist/PromptDirector-{version}.zip') as archive:
              archive.extractall(destination)
          env = {**os.environ, 'PROMPTDIRECTOR_E2E_EXTENSION_DIR': str(destination), 'PROMPTDIRECTOR_E2E_BLOCK_EXTERNAL_NETWORK': '1'}
          for script in ['project_tree_e2e.py', 'library_import_resources_e2e.py', 'library_import_ui_e2e.py', 'library_import_interruption_e2e.py', 'image_generation_info_e2e.py', 'skill_cover_e2e.py']:
              subprocess.run([sys.executable, f'test/{script}'], env=env, check=True)
          PY
      - run: npm run test:upgrade

  connector-platforms:
    name: Native connector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --prefix connector --ignore-scripts
      - run: node --test connector/test/*.test.mjs
        shell: bash
