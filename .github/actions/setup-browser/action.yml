name: Pinned isolated Chromium runtime
description: Install the existing Node/Python/Chromium test environment
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - run: npm ci
      shell: bash
    - run: python -m pip install playwright==1.58.0
      shell: bash
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        # The runner's unrelated Chrome mirror is not needed by Playwright.
        sudo python - <<'PYTHON'
        from pathlib import Path
        for source in Path('/etc/apt/sources.list.d').iterdir():
            if source.suffix in ('.list', '.sources') and 'dl.google.com/linux/chrome' in source.read_text():
                source.rename(source.with_suffix(source.suffix + '.disabled'))
        PYTHON
        python -m playwright install --with-deps chromium
    - if: runner.os != 'Linux'
      run: python -m playwright install chromium
      shell: bash
