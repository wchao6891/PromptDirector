<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">PromptDirector</title>
  <desc id="desc">Capture, collect, organize. References from Higgsfield, Jimeng and X come together in a personal visual library. Concept diagram.</desc>
